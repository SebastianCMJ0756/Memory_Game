<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Memory - Hand Controller Game</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- MediaPipe Hands & Drawing Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Ventana flotante de la cámara con Canvas para esqueleto visual -->
  <div class="webcam-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="webcam-canvas"></canvas>
    <span class="webcam-label">Cámara en Vivo</span>
  </div>

  <!-- Cursor flotante que sigue el dedo -->
  <div id="hand-cursor" class="cursor hidden">
    <svg class="progress-ring" width="48" height="48">
      <circle class="progress-ring-circle" stroke="#00f2fe" stroke-width="4" fill="transparent" r="20" cx="24" cy="24"/>
    </svg>
    <div class="dot"></div>
  </div>

  <main class="game-container">
    <header class="hud">
      <div class="hud-item">
        <span class="label">Nivel</span>
        <span id="level-display" class="value">1</span>
      </div>
      <div class="hud-item">
        <span class="label">Intentos</span>
        <span id="moves-display" class="value">0</span>
      </div>
      <div class="hud-item">
        <span class="label">Parejas</span>
        <span id="pairs-display" class="value">0 / 3</span>
      </div>
    </header>

    <div id="event-banner" class="event-banner hidden">
      ⚡ EVENTO ESPECIAL ACTIVADO ⚡
    </div>

    <!-- Tablero de tarjetas -->
    <div id="grid-container" class="grid-container"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
